version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "54123:54123"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:20128/v1}
      LLM_MODEL: ${LLM_MODEL:-gh/gpt-5.6-terra}
      DATAROBOT_API_TOKEN: ${DATAROBOT_API_TOKEN:-}
      DATAROBOT_ENTITY_ID: ${DATAROBOT_ENTITY_ID:-}
      DATAROBOT_ENDPOINT: ${DATAROBOT_ENDPOINT:-}
      DATAROBOT_OTEL_ENDPOINT: ${DATAROBOT_OTEL_ENDPOINT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/var:/app/backend/var
      - ./data:/app/data:ro
      - ./reports:/app/reports:ro
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "43123:43123"
    depends_on:
      - backend

  # ---- Security toolkit: `docker compose --profile security run --rm <tool>` ----
  # Each tool sees only this project folder. Reports land in ./reports/security.
  gitleaks:
    profiles: ["security"]
    image: zricethezav/gitleaks:v8.30.1
    working_dir: /src
    volumes: ["./:/src"]
    command: ["dir", ".", "--config", "security/.gitleaks.toml", "--redact", "--no-banner", "--exit-code", "0",
              "--report-format", "json", "--report-path", "/src/reports/security/gitleaks.json"]
  trufflehog:
    profiles: ["security"]
    image: trufflesecurity/trufflehog:3.99.8
    working_dir: /src
    volumes: ["./:/src"]
    # verification stays OFF here; use scripts/security_scan.sh with TRUFFLEHOG_VERIFY=1 to opt in
    command: ["filesystem", ".", "--json", "--no-update", "--no-verification", "--exclude-paths", "security/trufflehog-exclude.txt"]
  trivy:
    profiles: ["security"]
    image: aquasec/trivy:0.76.2
    working_dir: /src
    volumes: ["./:/src", "trivy-cache:/root/.cache/trivy"]
    command: ["fs", "--config", "security/trivy.yaml", "--format", "json", "--output", "/src/reports/security/trivy.json", "."]
  semgrep:
    profiles: ["security"]
    image: semgrep/semgrep:1.184.0
    working_dir: /src
    volumes: ["./:/src"]
    command: ["semgrep", "scan", "--metrics=off", "--config", "security/semgrep.yml", "--config", "p/python", "--config", "p/typescript",
              "--config", "p/react", "--exclude", "node_modules", "--exclude", "data/security_fixtures", "--exclude", "reports",
              "--json", "--output", "/src/reports/security/semgrep.json", "."]
  # Prowler is NOT in this profile on purpose: it needs your own cloud credentials.
  # Run it with: PROWLER_OPT_IN=1 PROWLER_PROVIDER=aws AWS_PROFILE=<yours> make scan-cloud

  # ---- Optional LightRAG retrieval: `docker compose --profile lightrag up --build backend-lightrag` ----
  # Same API on port 54124 with RETRIEVAL_BACKEND=lightrag. LLM and embeddings from Ollama.
  backend-lightrag:
    profiles: ["lightrag"]
    build:
      context: .
      dockerfile: backend/Dockerfile.lightrag
    ports:
      - "54124:54123"
    environment:
      RETRIEVAL_BACKEND: lightrag
      OLLAMA_HOST: ${OLLAMA_HOST:-http://192.168.70.20:11434}
      LIGHTRAG_LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-qwen3:4b}
      LIGHTRAG_EMBED_MODEL: ${LIGHTRAG_EMBED_MODEL:-nomic-embed-text}
      LIGHTRAG_EMBED_DIM: ${LIGHTRAG_EMBED_DIM:-768}
      LIGHTRAG_QUERY_MODE: ${LIGHTRAG_QUERY_MODE:-hybrid}
      LIGHTRAG_WORKDIR: /app/backend/var/lightrag
    volumes:
      - ./backend/var:/app/backend/var
      - ./reports:/app/reports:ro

volumes:
  trivy-cache: {}
