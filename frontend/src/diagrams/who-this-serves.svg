<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img">
  <title>Who the desk serves</title>
  <rect width="100%" height="100%" fill="#F6F8FA"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16324F"/>
    </marker>
  </defs>
  <rect x="430" y="150" width="220" height="88" rx="12" fill="#E5F6EE" stroke="#0C6B4D" stroke-width="2"/>
  <text x="540.0" y="182.8" text-anchor="middle" fill="#16324F" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16">
    <tspan x="540.0" dy="0" font-weight="700">Casework analyst</tspan>
    <tspan x="540.0" dy="18">the only user</tspan>
  </text>
  <rect x="760" y="36" width="240" height="78" rx="12" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="880.0" y="63.8" text-anchor="middle" fill="#16324F" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16">
    <tspan x="880.0" dy="0" font-weight="700">Credit risk</tspan>
    <tspan x="880.0" dy="18">reply is stored</tspan>
  </text>
  <rect x="760" y="150" width="240" height="78" rx="12" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="880.0" y="177.8" text-anchor="middle" fill="#16324F" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16">
    <tspan x="880.0" dy="0" font-weight="700">Lending ops</tspan>
    <tspan x="880.0" dy="18">same queue</tspan>
  </text>
  <rect x="760" y="264" width="240" height="78" rx="12" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="880.0" y="291.8" text-anchor="middle" fill="#16324F" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16">
    <tspan x="880.0" dy="0" font-weight="700">Pod lead</tspan>
    <tspan x="880.0" dy="18">escalate records it</tspan>
  </text>
  <rect x="40" y="80" width="250" height="78" rx="12" fill="#F6F8FA" stroke="#D8DEE6" stroke-width="2"/>
  <text x="165.0" y="107.8" text-anchor="middle" fill="#3E4C5E" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16">
    <tspan x="165.0" dy="0" font-weight="700">Applicant</tspan>
    <tspan x="165.0" dy="18">a row in the file</tspan>
  </text>
  <rect x="40" y="230" width="250" height="78" rx="12" fill="#FFE4E6" stroke="#9F1239" stroke-width="2"/>
  <text x="165.0" y="257.8" text-anchor="middle" fill="#9F1239" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16">
    <tspan x="165.0" dy="0" font-weight="700">Another bank</tspan>
    <tspan x="165.0" dy="18">refused</tspan>
  </text>
  <line x1="656" y1="194.0" x2="752" y2="75.0" stroke="#16324F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="656" y1="194.0" x2="752" y2="189.0" stroke="#16324F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="656" y1="194.0" x2="752" y2="303.0" stroke="#16324F" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
