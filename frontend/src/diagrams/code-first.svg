<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="260" viewBox="0 0 1040 260" role="img">
  <title>Code first path from Start to a human decision</title>
  <rect width="100%" height="100%" fill="#F6F8FA"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16324F"/>
    </marker>
  </defs>
  <rect x="28" y="36" width="168" height="92" rx="12" fill="#E5F6EE" stroke="#0C6B4D" stroke-width="2"/>
  <text x="112.0" y="70.8" text-anchor="middle" fill="#16324F" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16">
    <tspan x="112.0" dy="0" font-weight="700">Start</tspan>
    <tspan x="112.0" dy="18">run_triage</tspan>
  </text>
  <rect x="232" y="36" width="168" height="92" rx="12" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="316.0" y="70.8" text-anchor="middle" fill="#16324F" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16">
    <tspan x="316.0" dy="0" font-weight="700">Planner</tspan>
    <tspan x="316.0" dy="18">this bank only</tspan>
  </text>
  <line x1="200" y1="82.0" x2="226" y2="82.0" stroke="#16324F" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="436" y="36" width="168" height="92" rx="12" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="520.0" y="70.8" text-anchor="middle" fill="#16324F" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16">
    <tspan x="520.0" dy="0" font-weight="700">Operator</tspan>
    <tspan x="520.0" dy="18">graph, then draft</tspan>
  </text>
  <line x1="404" y1="82.0" x2="430" y2="82.0" stroke="#16324F" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="640" y="36" width="168" height="92" rx="12" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="724.0" y="70.8" text-anchor="middle" fill="#16324F" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16">
    <tspan x="724.0" dy="0" font-weight="700">Checker</tspan>
    <tspan x="724.0" dy="18">citation required</tspan>
  </text>
  <line x1="608" y1="82.0" x2="634" y2="82.0" stroke="#16324F" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="844" y="36" width="168" height="92" rx="12" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="928.0" y="70.8" text-anchor="middle" fill="#16324F" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="16">
    <tspan x="928.0" dy="0" font-weight="700">End</tspan>
    <tspan x="928.0" dy="18">draft returned</tspan>
  </text>
  <line x1="812" y1="82.0" x2="838" y2="82.0" stroke="#16324F" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="28" y="168" width="984" height="64" rx="12" fill="#E5F6EE" stroke="#0C6B4D" stroke-width="2"/>
  <text x="520.0" y="200.0" text-anchor="middle" fill="#0C6B4D" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="18">
    <tspan x="520.0" dy="0" font-weight="700">Then a person: Approve, Escalate, or Reject</tspan>
  </text>
</svg>
